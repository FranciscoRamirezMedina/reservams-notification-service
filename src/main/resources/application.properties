spring.application.name=reservams-notification-service

server.port=8088

spring.datasource.url=jdbc:mysql://localhost:3306/reservams_notification_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health,info

# Configuracion de Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Configuracion del consumer
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Permite deserializar eventos recibidos desde reservation-service
spring.kafka.consumer.properties.spring.json.trusted.packages=*