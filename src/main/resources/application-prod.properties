# Perfil para Docker / producción

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

eureka.client.service-url.defaultZone=${EUREKA_URL}

# Configuracion de Kafka para Docker
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Configuracion del consumer
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Permite deserializar eventos recibidos desde reservation-service
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.duoc.reservams.notificationservice.event.ReservationCreatedEvent